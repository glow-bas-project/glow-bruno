info:
  name: Update User by ID
  type: http
  seq: 5

http:
  method: PUT
  url: "{{userServiceUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Demo Customer",
        "phoneNumber": "+45 12 34 56 78",
        "email": "demo.customer@example.com",
        "permissions": [
          "CUSTOMER"
        ],
        "savedAddresses": [],
        "vehicleType": null,
        "courierAvailability": null,
        "restaurantId": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
