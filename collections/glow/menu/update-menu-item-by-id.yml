info:
  name: Update Menu Item by ID
  type: http
  seq: 3

http:
  method: PUT
  url: "{{menuServiceUrl}}/menu-items/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "restaurantId": "",
        "name": "Demo Burger",
        "description": "Classic demo burger",
        "price": 9900,
        "category": "BURGER",
        "ingredients": [
          "beef",
          "bun",
          "cheese"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
